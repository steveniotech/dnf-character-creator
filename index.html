<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗡️ Character Creator 🧙‍♂️</h1>
        
        <div id="errorBox" class="error-box" style="display: none;"></div>

        <form id="character-form">
            <div class="form-group">
                <label for="char-name">Hero Name:</label>
                <input type="text" id="char-name" placeholder="e.g. Arthur" required minlength="3">
            </div>

            <div class="form-group">
                <label for="char-level">Starting Level (1-99):</label>
                <input type="number" id="char-level" placeholder="1" required min="1" max="99">
            </div>

            <div class="form-group">
                <label for="char-class">Class Type:</label>
                <select id="char-class">
                    <option value="Warrior">Warrior ⚔️</option>
                    <option value="Mage">Mage 🔮</option>
                </select>
            </div>

            <div class="form-group">
                <label>Choose Avatar Skin:</label>
                <div class="skin-selector">
                    <label>
                        <input type="radio" name="char-skin" value="default" checked> 
                        🧑 Default
                    </label>
                    <label>
                        <input type="radio" name="char-skin" value="cyber"> 
                        🤖 Cyberpunk
                    </label>
                    <label>
                        <input type="radio" name="char-skin" value="undead"> 
                        💀 Undead
                    </label>
                </div>
            </div>

            <div class="form-group" id="weapon-group">
                <label for="char-weapon">Weapon:</label>
                <input type="text" id="char-weapon" placeholder="e.g. Broadsword" value="Sword">
            </div>
            
            <div class="form-group" id="spell-group" style="display: none;">
                <label for="char-spell">Spell:</label>
                <input type="text" id="char-spell" placeholder="e.g. Fireball" value="Fireball">
            </div>

            <button type="submit" class="btn">Create Character</button>
        </form>

        <h2>My Party</h2>
        <div id="character-list" class="character-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
